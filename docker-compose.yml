services:
  sonora-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonora-ai-backend
    ports:
      - "8080:8000"
    environment:
      - PORT=8000
    volumes:
      - ./backend/media:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  sonora-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sonora-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - sonora-backend
    restart: unless-stopped
